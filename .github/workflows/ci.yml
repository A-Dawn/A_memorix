name: CI

on:
  push:
    branches: [main, refactor/generic-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,vector,build]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux without Faiss
            os: ubuntu-latest
            install: ".[test]"
            tests: tests/test_cli_operations.py
          - name: Windows with Faiss
            os: windows-latest
            install: ".[test,vector]"
            tests: tests
          - name: Windows without Faiss
            os: windows-latest
            install: ".[test]"
            tests: tests/test_cli_operations.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "${{ matrix.install }}"
      - run: pytest -q ${{ matrix.tests }}

  protocol-and-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          github_token: ${{ github.token }}
      - run: buf lint
      - if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.event.pull_request.base.ref }}"
      - run: buf generate
      - run: git diff --exit-code
      - run: go test ./...

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile.server, Dockerfile.gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
